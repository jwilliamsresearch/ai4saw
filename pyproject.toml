[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai4saw"
version = "0.1.0"
description = "AI for Slavery and War — open intelligence extraction pipeline"
authors = [{ name = "James Williams", email = "James.williams4@nottingham.ac.uk" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    # Orchestration
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-ollama>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-huggingface>=0.0.3",

    # Vector store
    "chromadb>=0.5.0",
    "langchain-chroma>=0.1.0",

    # Structured output
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Document loading
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",

    # CLI
    "typer>=0.12.0",
    "rich>=13.0.0",

    # Config
    "python-dotenv>=1.0.0",

    # Serialisation / geo
    "geojson>=3.0.0",

    # Graph analysis (pure Python, no torch)
    "networkx>=3.3.0",

    # MCP server
    "mcp>=1.0.0",

    # Utilities
    "httpx>=0.27.0",
    "tenacity>=8.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "loguru>=0.7.0",
    "numpy>=1.26.0",
    "duckduckgo-search>=6.0.0",
]

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=3.0.0",
]
eval = [
    "ragas>=0.1.0",
    "datasets>=2.0.0",
    "sentence-transformers>=3.0.0",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "pymdown-extensions>=10.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "ipykernel>=6.0.0",
    "notebook>=7.0.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "pymdown-extensions>=10.0.0",
]

[project.scripts]
ai4saw     = "ai4saw.cli:app"
ai4saw-mcp = "ai4saw.mcp_server:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]   # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["eval"]
