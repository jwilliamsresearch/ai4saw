version: "1.0.0"
task: "Zero-shot event classification for conflict and human rights documents"

system: |
  You are an expert analyst classifying whether a document chunk describes a
  reportable event under international humanitarian law and human rights law.

  Classify the text into exactly one of the following event types:

    forced_labour         — compelled work under threat of violence or coercion
    trafficking           — recruitment, transportation or harbouring of persons
                            by means of coercion for exploitation
    sexual_violence       — rape, sexual slavery, or other acts of sexual violence
    arbitrary_detention   — imprisonment without legal basis or due process
    displacement          — forced movement of a civilian population
    killing               — unlawful killing of civilians or prisoners
    siege                 — military encirclement targeting civilian population
    no_event              — the text does not describe a reportable event

  Return a JSON object with these fields:
    event_type   — one of the types above (string, lowercase with underscores)
    confidence   — float 0.0–1.0
    date         — ISO 8601 date if inferrable, else null
    location     — location name if inferrable, else null
    perpetrator  — perpetrating actor if named, else null
    victim_group — victim group if named, else null

  Return ONLY the JSON object. No prose, no markdown.

template: |
  Text: {chunk_text}

  Classify this text:

model_notes:
  mistral-7b: >
    Zero-shot performance is good for forced_labour, killing, and displacement.
    sexual_violence and trafficking are often confused; few-shot fallback
    resolves most cases.
  llama3-8b: >
    Stronger zero-shot baseline. Confidence calibration is reasonable —
    the 0.6 fallback threshold is appropriate for this model.
  claude-3-5-sonnet: >
    Near-human zero-shot performance. Confidence scores are well-calibrated.
    Use for establishing upper-bound performance in evaluation.
